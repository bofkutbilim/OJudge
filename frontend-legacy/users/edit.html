<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto&display=swap" rel="stylesheet" />
  <title>Update User Profile</title>
</head>
<body>
  <header class="main-header">
    <nav class="navbar">
      <div class="nav-left">
        <ul class="nav-list">
          <li><a href="../archieve.html">АРХИВ</a></li>
          <li><a href="../submissions.html">ПОСЫЛКИ</a></li>
          <li><a href="../topics.html">ТЕМЫ</a></li>
          <li><a href="../ranklist.html">РЕЙТИНГ</a></li>
        </ul>
      </div>
      <div class="nav-right">
        <div id="login-icon"></div>
      </div>
    </nav>
  </header>

  <br>

  <div class="container">
    <div class="left_right" style="margin-left:500px;margin-right:500px;">
       <div id="modalHeader" class="section">Загрузка...</div><br><br>
       <form id="userForm" onsubmit="updateUser()">
      </form>
    </div>
  </div>
</body>
</html>

<script>

  function getFromUrl(x) {
    const params = new URLSearchParams(window.location.search);
    return params.get(x);
  }

  async function loadData() {
    const id = getFromUrl("id");
    if (!id) {
      document.getElementById("modalHeader").textContent = "Пользователь не выбрана";
      return;
    }

    fetch(`https://localhost:7003/api/user/get${id}`)
    .then(response => {
      if (!response.ok) throw new Error("Не удалось загрузить пользователя");
      return response.json();
    })
    .then(user => {
      const header = document.getElementById("modalHeader");
      header.innerHTML = `Редактировать<br><span style="color:blue;">${user.id}. ${user.nickName}</span>`;
    })
    .catch(err => {
      console.error(err);
      document.getElementById("modalHeader").textContent = "Ошибка загрузки пользователя";
    });

    const form = document.getElementById("userForm");

    const input1 = document.createElement("input");
    input1.type = "text";
    input1.name = "name";
    input1.id = "name";
    input1.style="width:95%;";

    const input2 = document.createElement("input");
    input2.type = "text";
    input2.name = "surName";
    input2.id = "surName";
    input2.style="width:95%;";

    const organization = document.createElement("select");
    organization.id = "organization";
    organization.style = "width: 96%;";

    const responseO = await fetch(`https://localhost:7003/api/organization/get`);
    const organizations = await responseO.json();
    organizations.forEach(O => {
      organization.innerHTML += `<option value="${O.id}">${O.title}</option>`;
    });


    const country = document.createElement("select");
    country.id = "country";
    country.style = "width: 96%;";

    const responseC = await fetch(`https://localhost:7003/api/country/get`);
    const countries = await responseC.json();
    countries.forEach(O => {
      country.innerHTML += `<option value="${O.id}">${O.title}</option>`;
    });

    const label1 = document.createElement("label");
    label1.textContent = "Имя:";
    label1.htmlFor = "name";
    const label2 = document.createElement("label");
    label2.textContent = "Фамилия:";
    label2.htmlFor = "surName";
    const label3 = document.createElement("label");
    label3.textContent = "Страна:";
    label3.htmlFor = "country";
    const label4 = document.createElement("label");
    label4.textContent = "Организация:";
    label4.htmlFor = "organization";

    const button = document.createElement("button");
    button.type = "submit";
    button.textContent = "Изменить";

    form.appendChild(label1);
    form.appendChild(input1);
    form.appendChild(label2);
    form.appendChild(input2);
    form.appendChild(label3);
    form.appendChild(country);
    form.appendChild(label4);
    form.appendChild(organization);
    form.appendChild(button);

    // <label for="mtName">Название темы:<br></label>
    //     <input type="text" id="mtName" name="mtName" style="width:95%;" required/><br>
    //     <button type="submit">Изменить</button>
  }

  document.addEventListener("DOMContentLoaded", loadData);

  async function updateUser() {
    event.preventDefault();



    const payload = {
      name: document.getElementById("name").value,
      surName: document.getElementById("surName").value,
      countryId: document.getElementById("country").value,
      organizationId: document.getElementById("organization").value
    };

    const response = await fetch(`https://localhost:7003/api/user/update${getFromUrl("id")}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    });

    if (response.ok) {
      alert("Изменения сохранены");
      window.location.href = `profile.html?id=${getFromUrl("id")}`;
    }
  }

</script>

<script>
  async function LogoutSystem() {
    const response = await fetch("https://localhost:7003/api/user/logout", {
      method: "PUT"
    });

    if (response.ok) {
      const data = await response.json();
      alert(data.message);
      window.location.href = "archieve.html";
    } else {
      const error = await response.text();
      alert("Ошибка входа: " + error);
    }
  }
</script>

<script>
  async function toMyProfile() {
    const response = await fetch("https://localhost:7003/api/user/isactive");

    if (response.ok) {
      const data = await response.json();
      window.location.href = `profile.html?id=${data.userId}`
    } else {
      const error = await response.text();
      alert("Ошибка: " + error);
    }
  }
</script>

<script>
  fetch("https://localhost:7003/api/user/isactive")
    .then(response => response.json())
    .then(data => {

        if (data.message === "Active") {
          document.getElementById("login-icon").innerHTML = `
            <u><a href="#" class="login-link" onclick="toMyProfile()">${data.userNickName}</span></u> | 
            <a href="#" class="login-link" onclick="LogoutSystem()">ВЫЙТИ</a>
          `
        } else {
          document.getElementById("login-icon").innerHTML = `
            <a href="login.html" class="login-link">ВОЙТИ</a>
          `
        }
    });
</script>
