<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto&display=swap" rel="stylesheet" />
  <title>Update Main Topic</title>
</head>
<body>
  <header class="main-header">
    <nav class="navbar">
      <div class="nav-left">
        <ul class="nav-list">
          <li><a href="../archieve.html">АРХИВ</a></li>
          <li><a href="../submissions.html">ПОСЫЛКИ</a></li>
          <li><a href="../topics.html">ТЕМЫ</a></li>
          <li><a href="../ranklist.html">РЕЙТИНГ</a></li>
        </ul>
      </div>
      <div class="nav-right">
        <div id="login-icon"></div>
      </div>
    </nav>
  </header>

  <br>

  <div class="container">
    <div class="left_right" style="margin-left:500px;margin-right:500px;">
       <div id="modalHeader" class="section">Загрузка...</div><br><br>
       <form id="MainTopicForm" onsubmit="updateMainTheme()">
        <label for="mtName">Название темы:<br></label>
        <input type="text" id="mtName" name="mtName" style="width:95%;" required/><br>
        <button type="submit">Изменить</button>
      </form>
    </div>
  </div>
</body>
</html>

<script>

  function getFromUrl(x) {
    const params = new URLSearchParams(window.location.search);
    return params.get(x);
  }

  function loadData() {
    const id = getFromUrl("id");
    if (!id) {
      document.getElementById("modalHeader").textContent = "Тема не выбрана";
      return;
    }

    fetch(`https://localhost:7003/api/maintopic/get${id}`)
    .then(response => {
      if (!response.ok) throw new Error("Не удалось загрузить тему");
      return response.json();
    })
    .then(mainTopic => {
      const header = document.getElementById("modalHeader");
      header.innerHTML = `Редактировать тему<br><span style="color:red;">${mainTopic.id}. ${mainTopic.title}</span>`;
    })
    .catch(err => {
      console.error(err);
      document.getElementById("modalHeader").textContent = "Ошибка загрузки темы";
    });
  }

  document.addEventListener("DOMContentLoaded", loadData);

  async function updateMainTheme() {
    event.preventDefault();

    const title = document.getElementById("mtName").value;

    const payload = {};
    payload.title = title;

    const response = await fetch(`https://localhost:7003/api/maintopic/update${getFromUrl("id")}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

    if (response.ok) {
      document.getElementById("MainTopicForm").reset();
      alert("Изменения сохранены");
      window.location.href = "../topics.html";
    } else {
      alert("Ошибка: " + response.json().message);
    }
    
  }

</script>

<script>
  async function LogoutSystem() {
    const response = await fetch("https://localhost:7003/api/user/logout", {
      method: "PUT"
    });

    if (response.ok) {
      const data = await response.json();
      alert(data.message);
      window.location.href = "archieve.html";
    } else {
      const error = await response.text();
      alert("Ошибка входа: " + error);
    }
  }
</script>

<script>
  async function toMyProfile() {
    const response = await fetch("https://localhost:7003/api/user/isactive");

    if (response.ok) {
      const data = await response.json();
      window.location.href = `users/profile.html?id=${data.userId}`
    } else {
      const error = await response.text();
      alert("Ошибка: " + error);
    }
  }
</script>

<script>
  fetch("https://localhost:7003/api/user/isactive")
    .then(response => response.json())
    .then(data => {

        if (data.message === "Active") {
          document.getElementById("login-icon").innerHTML = `
            <u><a href="#" class="login-link" onclick="toMyProfile()">${data.userNickName}</span></u> | 
            <a href="#" class="login-link" onclick="LogoutSystem()">ВЫЙТИ</a>
          `
        } else {
          document.getElementById("login-icon").innerHTML = `
            <a href="login.html" class="login-link">ВОЙТИ</a>
          `
        }
    });
</script>
